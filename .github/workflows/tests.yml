name: tests

on: [push, pull_request]

jobs:
  # Full suite: real ML/vector deps installed, runs every test (mocked tests
  # still mock chromadb/sentence-transformers, but numpy math runs for real).
  full:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chromadb sentence-transformers numpy pyyaml pytest
          # tomli backports tomllib for the config loader on < 3.11 (Vigil also
          # ships a fallback parser, so this just exercises the real path).
          python -c "import sys" && pip install "tomli; python_version < '3.11'"
      - name: Run full test suite
        run: PYTHONPATH=src pytest -q

  # Light job: only the no-heavy-deps lightweight checks. Proves the standard-
  # library checks (stale/orphans/provenance/health/report/ebbinghaus) and the
  # package import work with just pyyaml + pytest installed.
  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
      - name: Import check
        run: PYTHONPATH=src python -c "import vigil; import mcp_server; print('import ok', vigil.__version__)"
      - name: Run lightweight tests (no chromadb / embeddings / numpy)
        # These suites use only stdlib + pyyaml: lightweight scanner checks,
        # the .vigil.toml config loader, health-trend history, the fix planner /
        # archiver, the pre-commit hook gate, and the serve daemon (models mocked).
        run: >
          PYTHONPATH=src pytest -q
          tests/test_scanner.py
          tests/test_config.py
          tests/test_history.py
          tests/test_fix.py
          tests/test_hook.py
          tests/test_daemon.py
